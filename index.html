<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phoenix Assist Demo</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
    body { max-width: 720px; margin: 36px auto; padding: 0 18px; background: #111827; color: #f3f4f6; }
    h1 { margin-bottom: 4px; } small, #status { color: #aebaca; }
    #log { min-height: 260px; margin: 24px 0; padding: 16px; background: #1f2937; border-radius: 12px; }
    .line { margin: 12px 0; line-height: 1.5; overflow-wrap: anywhere; }
    .agent { color: #9dd4ff; } .you { color: #e8d39a; }
    form, .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    input { flex: 1; min-width: 180px; padding: 12px; border-radius: 8px; border: 1px solid #64748b; background: #0b1220; color: white; }
    button, .button-link { padding: 12px; border: 0; border-radius: 8px; background: #38bdf8; color: #051c2c; font-weight: 700; cursor: pointer; font: inherit; text-decoration: none; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #status { min-height: 24px; }
  </style>
</head>
<body>
  <h1>Phoenix Assist</h1>
  <small>Fictional bank demo. No real card or account is connected. Browser speech recognition may use an online service.</small>
  <p><label for="language">Language: </label><select id="language"><option value="en">English</option><option value="ar">العربية</option></select> <small>Changing language starts a new case.</small></p>
  <div id="log" role="log" aria-live="polite"></div>
  <form id="form"><input id="message" aria-label="Your message" maxlength="300" autocomplete="off" placeholder="Type yes, LOST, STATUS or HUMAN"><button id="send">Send</button></form>
  <div class="buttons"><button id="mic" type="button">🎙 Speak</button><button id="new" type="button">New case</button><button id="sound" type="button">🔊 Voice on</button></div>
  <div class="buttons"><a id="bank" class="button-link" href="#" target="_blank" rel="noopener" aria-disabled="true">Open mock banking app</a><button id="check" type="button">Check approval</button><a id="review" class="button-link" href="#" target="_blank" rel="noopener" aria-disabled="true">View case passport</a></div>
  <p id="status" role="status"></p>
  <script>
    const log = document.querySelector('#log');
    const input = document.querySelector('#message');
    const send = document.querySelector('#send');
    const mic = document.querySelector('#mic');
    const status = document.querySelector('#status');
    const form = document.querySelector('#form');
    const sound = document.querySelector('#sound');
    const language = document.querySelector('#language');
    const bank = document.querySelector('#bank');
    const review = document.querySelector('#review');
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let busy = false;
    let done = false;
    let approvalShown = false;
    let speaking = true;

    if (!Recognition) { mic.disabled = true; status.textContent = 'Microphone transcription is unavailable here. You can still type and hear replies.'; }
    if (!('speechSynthesis' in window)) { sound.disabled = true; speaking = false; sound.textContent = 'Voice unavailable'; }

    function line(who, value) {
      const div = document.createElement('div');
      div.className = 'line ' + who;
      div.dir = language.value === 'ar' ? 'rtl' : 'ltr';
      div.textContent = (who === 'agent' ? 'Agent: ' : 'You: ') + value;
      log.append(div);
      div.scrollIntoView({block: 'nearest'});
    }
    function speak(value) {
      if (!speaking) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(value);
      utterance.lang = language.value === 'ar' ? 'ar-AE' : 'en-US';
      speechSynthesis.speak(utterance);
    }
    function controls() {
      send.disabled = busy || done;
      mic.disabled = !Recognition || busy || done;
      input.disabled = busy || done;
    }
    async function request(path, data) {
      const response = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Request failed');
      return result;
    }
    async function newCase() {
      busy = true; done = false; approvalShown = false; controls(); log.replaceChildren();
      bank.href = '#'; bank.setAttribute('aria-disabled', 'true');
      review.href = '#'; review.setAttribute('aria-disabled', 'true');
      window.speechSynthesis?.cancel();
      try {
        const result = await request('/api/new', {language: language.value});
        line('agent', result.message);
        status.textContent = 'New fictional case. Type or tap Speak.';
        // Speech starts after a user gesture if the browser requires one.
      } catch (error) { status.textContent = error.message; }
      finally { busy = false; controls(); input.focus(); }
    }
    async function submit(value) {
      if (busy || done || !value.trim()) return;
      busy = true; controls(); line('you', value); input.value = '';
      try {
        const result = await request('/api/reply', {message: value});
        if (result.approval_id) {
          bank.href = '/bank?case=' + encodeURIComponent(result.approval_id);
          bank.removeAttribute('aria-disabled');
        }
        line('agent', result.message); speak(result.message);
        done = result.done;
        if (done) {
          bank.href = '#'; bank.setAttribute('aria-disabled', 'true');
          review.href = '/review'; review.removeAttribute('aria-disabled');
        }
        status.textContent = done ? 'Case ended. Events: ' + result.events.join(', ') : 'Your turn.';
      } catch (error) { status.textContent = error.message; }
      finally { busy = false; controls(); input.focus(); }
    }
    form.addEventListener('submit', event => { event.preventDefault(); submit(input.value); });
    bank.addEventListener('click', event => {
      if (bank.getAttribute('aria-disabled') === 'true') {
        event.preventDefault(); status.textContent = 'Give consent before opening the mock banking app.';
      }
    });
    review.addEventListener('click', event => {
      if (review.getAttribute('aria-disabled') === 'true') {
        event.preventDefault(); status.textContent = 'Finish the case before viewing its passport.';
      }
    });
    document.querySelector('#new').addEventListener('click', () => { newCase().then(() => { if (log.lastChild) speak(log.lastChild.textContent.slice(7)); }); });
    language.addEventListener('change', () => {
      if (recognition) recognition.lang = language.value === 'ar' ? 'ar-AE' : 'en-US';
      newCase().then(() => { if (log.lastChild) speak(log.lastChild.textContent.slice(7)); });
    });
    sound.addEventListener('click', () => {
      speaking = !speaking;
      sound.textContent = speaking ? '🔊 Voice on' : '🔇 Voice off';
      if (!speaking) window.speechSynthesis?.cancel();
    });
    document.querySelector('#check').addEventListener('click', async () => {
      if (busy || done) return;
      try {
        const response = await fetch('/api/state', {cache: 'no-store'});
        const state = await response.json();
        if (!response.ok) throw new Error(state.error);
        if (state.approved && !approvalShown) {
          line('agent', state.message); speak(state.message);
          approvalShown = true;
          status.textContent = 'Mock banking-app approval recorded. Your turn.';
        } else if (state.approved) {
          status.textContent = 'Approval already recorded. Choose LOST, STATUS or HUMAN.';
        } else {
          status.textContent = state.done ? 'This case has ended. Start a new case.' : 'No approval yet. Open the mock banking app after giving consent.';
        }
        done = state.done;
        if (done) { review.href = '/review'; review.removeAttribute('aria-disabled'); }
        controls();
      } catch (error) { status.textContent = error.message; }
    });
    if (Recognition) {
      recognition = new Recognition();
      recognition.lang = 'en-US'; recognition.interimResults = false; recognition.maxAlternatives = 1;
      recognition.onresult = event => submit(event.results[0][0].transcript);
      recognition.onerror = event => { status.textContent = 'Microphone: ' + event.error + '. You can type instead.'; };
      mic.addEventListener('click', () => {
        if (busy || done) return;
        window.speechSynthesis?.cancel();
        try { recognition.start(); status.textContent = 'Listening…'; }
        catch { status.textContent = 'Microphone is already starting. Try again shortly.'; }
      });
    }
    newCase();
  </script>
</body>
</html>
